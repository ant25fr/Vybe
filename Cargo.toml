# Dev builds stay debuggable for the UI, but the real-time audio path
# (engine callback, synth/DSP inner loops, FFT and resampling) is compiled
# optimized even in `cargo build`: those crates dominate CPU in debug, and
# opt-level 3 without fast-math keeps floating-point results bit-identical.
# Dependencies are built optimised even in development: text shaping, the
# renderer and the GPU layer are what a debug build's opening waits on.
[profile.dev.package."*"]
opt-level = 3

# Build scripts and macros run at compile time only.
[profile.dev.build-override]
opt-level = 0

[profile.dev.package.vibez-core]
opt-level = 3

[profile.dev.package.vibez-dsp]
opt-level = 3

[profile.dev.package.vibez-instruments]
opt-level = 3

[profile.dev.package.vibez-engine]
opt-level = 3

[profile.dev.package.vibez-audio-io]
opt-level = 3

[profile.dev.package.vibez-project]
opt-level = 3


[profile.dev.package.rustfft]
opt-level = 3

[profile.dev.package.rubato]
opt-level = 3

[workspace]
members = [
    "crates/vibez-core",
    "crates/vibez-engine",
    "crates/vibez-audio-io",
    "crates/vibez-dsp",
    "crates/vibez-instruments",
    "crates/vibez-plugin-host",
    "crates/vibez-plugin-host/tests/fixtures",
    "crates/vibez-project",
    "crates/vibez-ui",
]
resolver = "2"

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/vibez-daw/vibez"

[workspace.dependencies]
vibez-core = { path = "crates/vibez-core" }
vibez-engine = { path = "crates/vibez-engine" }
vibez-audio-io = { path = "crates/vibez-audio-io" }
vibez-dsp = { path = "crates/vibez-dsp" }
vibez-instruments = { path = "crates/vibez-instruments" }
vibez-plugin-host = { path = "crates/vibez-plugin-host" }
vibez-project = { path = "crates/vibez-project" }
vibez-ui = { path = "crates/vibez-ui" }

# Audio
# Host upgrades change ALSA, CoreAudio and WASAPI behaviour together. Keep them
# in a dedicated hardware-regression PR; CPAL 0.16 already provides ASIO.
cpal = "0.16"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "ogg", "vorbis", "wav", "aiff", "isomp4", "aac", "pcm"] }
rubato = "0.16"
rtrb = "0.3"
audio_thread_priority = "0.32"
midir = "0.10"
rustfft = "6.4"
# Standard MIDI File reading; "parallel" would pull in rayon.
midly = { version = "0.5", default-features = false, features = ["std"] }

# GUI
iced = { version = "0.13", features = ["advanced", "canvas", "lazy", "tokio"] }
iced_runtime = "0.13"
iced_tiny_skia = { version = "0.13", default-features = false }

# Shared
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
serde_json = "1"
notify = "8.2"

[package]
name = "vibez"
version.workspace = true
description = "A small open-source DAW for electronic music"
edition.workspace = true
license.workspace = true

[dependencies]
vibez-ui = { workspace = true }
vibez-plugin-host = { workspace = true }
iced = { workspace = true }

[build-dependencies]
winresource = { version = "0.1.31", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"

[package.metadata.deb]
maintainer = "Alex Wanyoike"
copyright = "2026 Alex Wanyoike"
license-file = ["LICENSE", "0"]
extended-description = "A small open-source DAW for electronic music, written in Rust. Multi-track arrangement, warping, piano roll, built-in instruments and effects, VST3/CLAP plugin hosting."
section = "sound"
depends = "$auto"
assets = [
    ["target/release/vibez", "usr/bin/", "755"],
    ["target/release/vibez-plugin-scan", "usr/bin/", "755"],
    ["target/release/vibez-plugin-bridge", "usr/bin/", "755"],
    ["assets/linux/vibez.desktop", "usr/share/applications/", "644"],
    ["assets/icon/vibez.svg", "usr/share/icons/hicolor/scalable/apps/vibez.svg", "644"],
    ["assets/icon/vibez-16.png", "usr/share/icons/hicolor/16x16/apps/vibez.png", "644"],
    ["assets/icon/vibez-32.png", "usr/share/icons/hicolor/32x32/apps/vibez.png", "644"],
    ["assets/icon/vibez-48.png", "usr/share/icons/hicolor/48x48/apps/vibez.png", "644"],
    ["assets/icon/vibez-64.png", "usr/share/icons/hicolor/64x64/apps/vibez.png", "644"],
    ["assets/icon/vibez-128.png", "usr/share/icons/hicolor/128x128/apps/vibez.png", "644"],
    ["assets/icon/vibez-256.png", "usr/share/icons/hicolor/256x256/apps/vibez.png", "644"],
    ["assets/icon/vibez-512.png", "usr/share/icons/hicolor/512x512/apps/vibez.png", "644"],
    ["assets/demo.vibez", "usr/share/vibez/demo.vibez", "644"],
]
