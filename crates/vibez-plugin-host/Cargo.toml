[package]
name = "vibez-plugin-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vibez-core = { workspace = true }
vibez-dsp = { workspace = true }
vibez-instruments = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap-sys = "0.5"
vst3 = "0.3"
rtrb = { workspace = true }
libloading = "0.8"
libc = "0.2"
dirs = "5"
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSView", "NSResponder", "NSApplication", "NSGraphics", "NSEvent", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSGeometry"] }

[target.'cfg(not(any(target_os = "macos", windows)))'.dependencies]
x11rb = "0.13"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_UI_WindowsAndMessaging"] }

[features]
test-fixtures = []

[dev-dependencies]
vibez-routing-fixture = { path = "tests/fixtures" }
vibez-engine = { workspace = true }
